backend:
  name: github
  repo: noahshootscarsoninsta/noahshootscars
  branch: main

# This tells Decap CMS where uploaded photos get stored in the repo,
# and what public URL path the live site should use to load them.
# NOTE: this path is relative to the REPO ROOT, not to this config file --
# because the published site actually lives one folder deeper
# (noah-shoots-cars-site/noah-shoots-cars-site/), the folder name has to be
# spelled out here too, or uploads land one level too high and don't show
# up on the live site.
media_folder: "noah-shoots-cars-site/noah-shoots-cars-site/images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "hero"
    label: "Home Page — Hero Photo"
    description: "The big photo at the very top of the Home page."
    files:
      - file: "content/hero.json"
        label: "Hero Photo"
        name: "hero"
        fields:
          - { label: "Photo", name: "image", widget: "image", required: true }

  - name: "featured"
    label: "Home Page — Featured Work (4 photos)"
    description: "The 4-photo grid on the Home page, under 'A few recent favorites'."
    files:
      - file: "content/featured.json"
        label: "Featured Photos"
        name: "featured"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            min: 1
            max: 4
            summary: "{{fields.caption}}"
            fields:
              - { label: "Photo", name: "image", widget: "image", required: true }
              - { label: "Caption (optional)", name: "caption", widget: "string", required: false }

  - name: "gallery"
    label: "Portfolio Photos"
    description: "Every photo shown on the Portfolio page. Add as many as you want, drag to reorder."
    files:
      - file: "content/gallery.json"
        label: "Portfolio Photos"
        name: "gallery"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "Photo", name: "image", widget: "image", required: true }
              - { label: "Caption (optional)", name: "caption", widget: "string", required: false }

  - name: "profile"
    label: "Photographer Photo"
    description: "Your photo, used on the Home page 'About' teaser and on the About page."
    files:
      - file: "content/profile.json"
        label: "Photographer Photo"
        name: "profile"
        fields:
          - { label: "Photo", name: "image", widget: "image", required: true }

  - name: "shows"
    label: "Upcoming Shows"
    description: "Car shows, meets, and events for the Upcoming Shows page. Add, edit, reorder, or remove as many as you want."
    files:
      - file: "content/shows.json"
        label: "Shows"
        name: "shows"
        fields:
          - label: "Shows"
            name: "shows"
            widget: "list"
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - { label: "Event name", name: "title", widget: "string", required: true }
              - { label: "Date", name: "date", widget: "date", required: true, format: "YYYY-MM-DD" }
              - { label: "Start time", name: "startTime", widget: "string", required: false, hint: "e.g. 10:00 AM" }
              - { label: "End time", name: "endTime", widget: "string", required: false, hint: "e.g. 2:00 PM" }
              - { label: "Location / venue name", name: "location", widget: "string", required: true }
              - { label: "Address", name: "address", widget: "string", required: false }
              - { label: "Short description", name: "description", widget: "text", required: false }
              - { label: "Event photo (optional)", name: "image", widget: "image", required: false }
              - { label: "Instagram or event link (optional)", name: "link", widget: "string", required: false }
              - label: "Status"
                name: "status"
                widget: "select"
                required: true
                default: "I'll be there"
                options: ["I'll be there", "Maybe", "Completed"]
